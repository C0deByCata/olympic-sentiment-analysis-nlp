[project]
name = "olympic-sentiment-analysis-nlp"
version = "0.1.0"
description = "An End-to-End NLP project analyzing YouTube comments from Paris 2024 using DistilBERT, LSTM (Seq2Seq), and RNN. Includes Bias Audit, LIME interpretability, and Advanced EDA."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "google-api-python-client (>=2.187.0,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "transformers (>=4.57.3,<5.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "wordcloud (>=1.9.5,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "keras (>=3.13.0,<4.0.0)",
    "tf-keras (>=2.20.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"

